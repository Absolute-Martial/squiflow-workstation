name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.2'
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Validate pipeline policy
        run: python3 tools/ci/check_pipeline.py
      - name: Run strict source gate
        run: make -f tools/sandbox/Makefile check
      - name: Build pinned libsodium for CMake lane
        run: echo "SQUIFLOW_SODIUM_ROOT=$(tools/ci/build-libsodium.sh)" >> "$GITHUB_ENV"
      - name: Configure, build and test portable CMake lane
        run: cmake --workflow --preset linux-check
  linux-qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.2'
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          modules: 'qtshadertools qtimageformats qttasktree'
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall@16db45a70b5905ad596941b223469bc86a56901e
      - name: Build pinned libsodium for CMake lane
        run: echo "SQUIFLOW_SODIUM_ROOT=$(tools/ci/build-libsodium.sh)" >> "$GITHUB_ENV"
      - name: Run Linux Qt build, tests and runtime diagnostics
        run: tools/ci/linux-qt-diagnostics.sh
      - name: Upload complete Linux Qt diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-qt-diagnostics-${{ github.run_id }}
          path: |
            build/linux-qt-diagnostics/**
            build/linux-qt-release/Testing/Temporary/**
            build/linux-qt-release/CMakeFiles/CMakeError.log
            build/linux-qt-release/CMakeFiles/CMakeOutput.log
            build/linux-qt-release/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

  windows-msvc:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SQUIFLOW_VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.2'
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.11.1'
          arch: win64_msvc2022_64
          modules: 'qtshadertools qtimageformats qttasktree'
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall@16db45a70b5905ad596941b223469bc86a56901e
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: '2026.07.29'
          path: .vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:SQUIFLOW_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - name: Build and test with MSVC
        env:
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
        run: cmake --workflow --preset windows-msvc-check
      - name: Launch offscreen dashboard smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: "& .\\build\\windows-msvc-release\\src\\ui\\squiflow_workstation.exe --smoke-test"
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-test-logs
          path: build/windows-msvc-release/Testing/Temporary/
          if-no-files-found: ignore
