name: Windows release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - uses: jwlawson/actions-setup-cmake@v2
        with: { cmake-version: '4.4.2' }
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.11.1'
          arch: win64_msvc2022_64
          modules: 'qtshadertools qtimageformats'
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall@16db45a70b5905ad596941b223469bc86a56901e
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: '2026.07.29'
          path: .vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Validate tag
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tag must be vMAJOR.MINOR.PATCH' }
      - name: Build, test and stage release
        run: cmake --workflow --preset windows-msvc-release-bundle
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem build/windows-msvc-release/artifacts/*.zip
          if ($files.Count -ne 1) { throw 'Expected exactly one release archive' }
          $hash = Get-FileHash -Algorithm SHA256 $files[0]
          "$($hash.Hash.ToLower())  $($files[0].Name)" | Set-Content build/windows-msvc-release/artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SquiFlow-${{ github.ref_name }}-windows-x64
          path: build/windows-msvc-release/artifacts/*
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/windows-msvc-release/artifacts/*.zip
            build/windows-msvc-release/artifacts/SHA256SUMS.txt
